<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Network - InternHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#2563eb;--navy:#0f172a;--sidebar-w:250px;}
*{font-family:'Inter',sans-serif;}body{background:#f1f5f9;}
.sidebar{width:var(--sidebar-w);height:100vh;position:fixed;top:0;left:0;background:var(--navy);overflow-y:auto;z-index:100;}
.sidebar-logo{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,.1);font-weight:800;font-size:1.2rem;color:white;}.sidebar-logo span{color:#60a5fa;}
.nav-item a{display:flex;align-items:center;gap:12px;padding:11px 20px;color:rgba(255,255,255,.65);text-decoration:none;font-size:.9rem;font-weight:500;border-radius:8px;margin:2px 8px;transition:.15s;}
.nav-item a:hover,.nav-item a.active{background:rgba(96,165,250,.15);color:#60a5fa;}
.main-content{margin-left:var(--sidebar-w);min-height:100vh;}
.topbar{background:white;border-bottom:1px solid #e2e8f0;padding:14px 28px;position:sticky;top:0;z-index:50;}
.section-card{background:white;border-radius:12px;padding:24px;border:1px solid #e2e8f0;margin-bottom:20px;}
.post-card{background:white;border-radius:12px;padding:20px;border:1px solid #e2e8f0;margin-bottom:16px;}
.avatar{width:40px;height:40px;border-radius:50%;background:#e2e8f0;display:flex;align-items:center;justify-content:center;font-weight:600;}
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-logo"><i class="bi bi-briefcase-fill me-2"></i>Intern<span>Hub</span></div>
  <ul class="nav flex-column mt-3" style="list-style:none;padding:0;">
    <li class="nav-item"><a href="/student-dashboard.html"><i class="bi bi-grid-fill"></i>Dashboard</a></li>
    <li class="nav-item"><a href="/student-profile.html"><i class="bi bi-person-fill"></i>My Profile</a></li>
    <li class="nav-item"><a href="/student-portfolio.html"><i class="bi bi-folder-fill"></i>Portfolio & Projects</a></li>
    <li class="nav-item"><a href="/network.html" class="active"><i class="bi bi-people-fill"></i>Network</a></li>
    <li class="nav-item"><a href="/events.html"><i class="bi bi-calendar-event"></i>Events</a></li>
    <li class="nav-item mt-3"><a href="#" onclick="localStorage.clear();window.location='/index.html'"><i class="bi bi-box-arrow-right"></i>Logout</a></li>
  </ul>
</div>
<div class="main-content">
  <div class="topbar d-flex align-items-center justify-content-between">
    <h6 class="mb-0 fw-700">Career Network</h6>
  </div>
  <div class="p-4">
    <div class="row g-4">
      <div class="col-lg-8">
        <div class="section-card mb-4">
          <div class="d-flex gap-3">
            <div class="avatar bg-primary text-white">ME</div>
            <div class="w-100">
              <textarea id="postContent" class="form-control mb-2" rows="2" placeholder="Share an update, project, or achievement..."></textarea>
              <div class="text-end"><button class="btn btn-primary btn-sm px-4 fw-600" onclick="createPost()">Post</button></div>
            </div>
          </div>
        </div>
        <div id="feed"><div class="text-center py-4"><div class="spinner-border text-primary"></div></div></div>
      </div>
      <div class="col-lg-4">
        <div class="section-card">
          <h6 class="fw-700 mb-3">Suggested Connections</h6>
          <p class="small text-muted mb-0">Feature coming soon.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API='http://localhost:8080';
const token=localStorage.getItem('authToken');
if(!token)window.location='/login.html';

async function loadFeed(){
  try{
    const res=await fetch(`${API}/api/community/posts`,{headers:{Authorization:token}});
    const data=await res.json();
    const el=document.getElementById('feed');
    if(!data.length){el.innerHTML='<div class="text-center text-muted py-5">No posts yet. Be the first to post!</div>';return;}
    el.innerHTML=data.map(p=>`
      <div class="post-card">
        <div class="d-flex gap-3 mb-3">
          <div class="avatar bg-secondary text-white">${p.authorEmail[0].toUpperCase()}</div>
          <div><div class="fw-600 small">${p.authorEmail}</div><div class="text-muted" style="font-size:0.75rem">${new Date(p.createdAt).toLocaleString()}</div></div>
        </div>
        <div class="mb-3">${p.content}</div>
        <div class="border-top pt-2 d-flex gap-3 text-muted small fw-600">
          <span style="cursor:pointer" onclick="alert('Liked!')"><i class="bi bi-hand-thumbs-up me-1"></i>${p.likes||0} Likes</span>
        </div>
      </div>
    `).join('');
  }catch(e){console.error(e);}
}

async function createPost(){
  const content=document.getElementById('postContent').value;
  if(!content.trim())return;
  await fetch(`${API}/api/community/posts`,{method:'POST',headers:{Authorization:token,'Content-Type':'application/json'},body:JSON.stringify({content})});
  document.getElementById('postContent').value='';
  loadFeed();
}
loadFeed();
</script>
</body>
</html>
