<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browse Internships - InternHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--primary:#2563eb;--navy:#0f172a;}
  *{font-family:'Inter',sans-serif;}
  body{background:#f8fafc;}
  .navbar{background:white;box-shadow:0 1px 3px rgba(0,0,0,.08);}
  .navbar-brand{font-weight:800;color:var(--primary)!important;}
  .sidebar{background:white;border-radius:12px;padding:20px;border:1px solid #e2e8f0;position:sticky;top:80px;}
  .sidebar h6{font-weight:700;color:var(--navy);font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;}
  .internship-card{background:white;border-radius:12px;padding:20px;border:1px solid #e2e8f0;transition:all .2s;margin-bottom:16px;}
  .internship-card:hover{border-color:var(--primary);box-shadow:0 4px 20px rgba(37,99,235,.1);}
  .company-avatar{width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;color:white;}
  .skill-chip{background:#eff6ff;color:var(--primary);padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:500;}
  .btn-primary{background:var(--primary);border-color:var(--primary);}
  .form-control:focus,.form-select:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,99,235,.1);}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg sticky-top px-3 px-lg-0">
  <div class="container">
    <a class="navbar-brand" href="/index.html"><i class="bi bi-briefcase-fill me-2"></i>InternHub</a>
    <div class="ms-auto d-flex gap-2">
      <a href="/login.html" class="btn btn-outline-primary btn-sm" id="loginBtn">Login</a>
    </div>
  </div>
</nav>

<div class="container py-4">
  <!-- Search Bar -->
  <div class="bg-white rounded-3 p-4 mb-4 border">
    <div class="row g-2">
      <div class="col-md-5"><input class="form-control" id="searchKw" placeholder="Job title, skills..."></div>
      <div class="col-md-3"><input class="form-control" id="searchLoc" placeholder="Location..."></div>
      <div class="col-md-2"><input class="form-control" id="searchSkill" placeholder="Skill..."></div>
      <div class="col-md-2"><button class="btn btn-primary w-100" onclick="loadInternships()"><i class="bi bi-search me-1"></i>Search</button></div>
    </div>
  </div>
  <div class="row">
    <!-- Sidebar Filters -->
    <div class="col-lg-3 d-none d-lg-block">
      <div class="sidebar">
        <h6 class="mb-3">Filter Results</h6>
        <div class="mb-4">
          <label class="form-label text-muted small fw-600">Work Mode</label>
          <div class="form-check"><input class="form-check-input" type="checkbox" id="fRemote"><label class="form-check-label small" for="fRemote">Remote</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" id="fHybrid"><label class="form-check-label small" for="fHybrid">Hybrid</label></div>
          <div class="form-check"><input class="form-check-input" type="checkbox" id="fOnsite"><label class="form-check-label small" for="fOnsite">On-site</label></div>
        </div>
        <div class="mb-4">
          <label class="form-label text-muted small fw-600">Stipend</label>
          <select class="form-select form-select-sm" id="fStipend">
            <option value="">Any</option>
            <option value="5000">₹5,000+</option>
            <option value="10000">₹10,000+</option>
            <option value="15000">₹15,000+</option>
          </select>
        </div>
        <button class="btn btn-outline-secondary btn-sm w-100" onclick="clearFilters()">Clear Filters</button>
      </div>
    </div>
    <!-- Results -->
    <div class="col-lg-9">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div><span id="resultCount" class="fw-600"></span></div>
        <select class="form-select form-select-sm w-auto" id="sortBy" onchange="loadInternships()">
          <option value="latest">Latest First</option>
          <option value="deadline">Deadline</option>
        </select>
      </div>
      <div id="internshipList"><div class="text-center py-5"><div class="spinner-border text-primary"></div></div></div>
    </div>
  </div>
</div>

<script>
const API='http://localhost:8080';
const COLORS=['#2563eb','#7c3aed','#059669','#d97706','#dc2626','#0891b2'];
function getColor(s){let h=0;for(let c of(s||''))h=c.charCodeAt(0)+((h<<5)-h);return COLORS[Math.abs(h)%COLORS.length];}
function initials(n){return(n||'?').split(' ').map(w=>w[0]).join('').substring(0,2).toUpperCase();}

// Read URL params
const params=new URLSearchParams(location.search);
window.onload=()=>{
  if(params.get('keyword'))document.getElementById('searchKw').value=params.get('keyword');
  if(params.get('location'))document.getElementById('searchLoc').value=params.get('location');
  if(params.get('skill'))document.getElementById('searchSkill').value=params.get('skill');
  const token=localStorage.getItem('authToken');
  if(token){const role=localStorage.getItem('userRole')||'';let href='/student-dashboard.html';if(role.includes('COMPANY'))href='/company-dashboard.html';if(role.includes('ADMIN'))href='/admin-dashboard.html';document.getElementById('loginBtn').innerHTML=`<a href="${href}" class="btn btn-primary btn-sm">Dashboard</a>`;}
  loadInternships();
};

function clearFilters(){document.getElementById('searchKw').value='';document.getElementById('searchLoc').value='';document.getElementById('searchSkill').value='';loadInternships();}

async function loadInternships(){
  const kw=document.getElementById('searchKw').value;
  const loc=document.getElementById('searchLoc').value;
  const skill=document.getElementById('searchSkill').value;
  let url=`${API}/api/public/internships?`;
  if(kw)url+=`keyword=${encodeURIComponent(kw)}&`;
  if(loc)url+=`location=${encodeURIComponent(loc)}&`;
  if(skill)url+=`skill=${encodeURIComponent(skill)}`;
  const el=document.getElementById('internshipList');
  el.innerHTML='<div class="text-center py-5"><div class="spinner-border text-primary"></div></div>';
  try{
    const res=await fetch(url);
    const data=await res.json();
    document.getElementById('resultCount').textContent=`${data.length} internship${data.length!==1?'s':''} found`;
    if(!data.length){el.innerHTML=`<div class="text-center py-5 text-muted"><i class="bi bi-search fs-1 d-block mb-3"></i><h5>No internships found</h5><p>Try different keywords or clear filters.</p></div>`;return;}
    const token=localStorage.getItem('authToken');
    el.innerHTML=data.map(i=>`
      <div class="internship-card">
        <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
          <div class="d-flex align-items-center gap-3">
            <div class="company-avatar" style="background:${getColor(i.companyName)}">${initials(i.companyName)}</div>
            <div>
              <h6 class="fw-700 mb-0">${i.title}</h6>
              <div class="text-muted small">${i.companyName}</div>
            </div>
          </div>
          <div class="d-flex gap-2 align-items-center">
            <span class="badge bg-success-subtle text-success border border-success-subtle">Active</span>
            ${token?`<button onclick="saveInternship(${i.id},this)" class="btn btn-sm btn-outline-secondary"><i class="bi bi-bookmark"></i></button>`:''}
          </div>
        </div>
        <div class="row mt-3 text-muted small g-2">
          <div class="col-auto"><i class="bi bi-geo-alt me-1"></i>${i.location||'Not specified'}</div>
          <div class="col-auto"><i class="bi bi-calendar me-1"></i>Deadline: ${i.deadline?new Date(i.deadline).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'Open'}</div>
          <div class="col-auto"><i class="bi bi-currency-rupee"></i><strong class="text-success">${i.stipend||'Unpaid'}</strong>/month</div>
        </div>
        <div class="d-flex flex-wrap gap-1 mt-3">
          ${(i.requiredSkills||'').split(',').map(s=>`<span class="skill-chip">${s.trim()}</span>`).join('')}
        </div>
        <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
          <div></div>
          <div class="d-flex gap-2">
            <a href="/internship-detail.html?id=${i.id}" class="btn btn-outline-primary btn-sm">View Details</a>
            ${token?`<button onclick="applyNow(${i.id},this)" class="btn btn-primary btn-sm">Apply Now</button>`:`<a href="/login.html" class="btn btn-primary btn-sm">Login to Apply</a>`}
          </div>
        </div>
      </div>`).join('');
  }catch(e){el.innerHTML='<div class="alert alert-warning"><i class="bi bi-exclamation-triangle me-2"></i>Cannot connect to backend. Make sure the server is running on port 8080.</div>';}
}

async function applyNow(id,btn){
  const token=localStorage.getItem('authToken');
  if(!token){window.location='/login.html';return;}
  btn.disabled=true;btn.textContent='Applying...';
  try{
    const res=await fetch(`http://localhost:8080/api/student/apply/${id}`,{method:'POST',headers:{Authorization:token}});
    const data=await res.json();
    if(res.ok){btn.textContent='Applied!';btn.className='btn btn-success btn-sm';showToast('Application submitted successfully!','success');}
    else{btn.disabled=false;btn.textContent='Apply Now';showToast(data.error||'Failed','error');}
  }catch(e){btn.disabled=false;btn.textContent='Apply Now';showToast('Connection error','error');}
}

async function saveInternship(id,btn){
  const token=localStorage.getItem('authToken');
  if(!token){window.location='/login.html';return;}
  try{
    const res=await fetch(`http://localhost:8080/api/student/save/${id}`,{method:'POST',headers:{Authorization:token}});
    const data=await res.json();
    if(res.ok){btn.innerHTML='<i class="bi bi-bookmark-fill text-primary"></i>';showToast('Saved!','success');}
    else showToast(data.error||'Failed','error');
  }catch(e){showToast('Error','error');}
}

function showToast(msg,type){const el=document.createElement('div');el.style.cssText='position:fixed;top:20px;right:20px;z-index:9999;';el.innerHTML=`<div class="alert alert-${type==='success'?'success':'danger'} d-flex align-items-center shadow">${msg}</div>`;document.body.appendChild(el);setTimeout(()=>el.remove(),3000);}
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
