<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - InternHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --primary-color: #008bdc; }
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .auth-card {
            max-width: 450px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .btn-primary { background-color: var(--primary-color); border: none; }
        .btn-primary:hover { background-color: #0073b7; }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-center mt-5">
            <a href="index.html" class="text-decoration-none text-dark fs-3 fw-bold">
                <i class="bi bi-briefcase-fill me-2" style="color: var(--primary-color);"></i>InternHub
            </a>
        </div>
        
        <div class="auth-card">
            <h3 class="text-center mb-4 fw-bold">Sign Up</h3>
            
            <div id="alertBox" class="alert d-none"></div>

            <form id="registerForm">
                <div class="mb-3">
                    <label class="form-label text-muted fw-semibold">I am a...</label>
                    <select class="form-select" id="role" required>
                        <option value="STUDENT">Student (Looking for internships)</option>
                        <option value="COMPANY">Company (Hiring interns)</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label text-muted fw-semibold">Email address</label>
                    <input type="email" class="form-control" id="email" required placeholder="john@example.com">
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted fw-semibold">Password</label>
                    <input type="password" class="form-control" id="password" required placeholder="Must be at least 6 characters">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="submitBtn">Sign up</button>
            </form>
            
            <div class="text-center mt-4">
                Already registered? <a href="login.html" class="text-decoration-none fw-bold" style="color: var(--primary-color);">Login</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('alertBox');
            
            btn.disabled = true;
            btn.innerText = "Registering...";
            alertBox.classList.add('d-none');
            
            const payload = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                role: document.getElementById('role').value
            };

            try {
                const response = await fetch('http://localhost:8080/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    alertBox.className = "alert alert-success";
                    alertBox.innerText = "Registration successful! Redirecting to login...";
                    setTimeout(() => window.location.href = 'login.html', 1500);
                } else {
                    alertBox.className = "alert alert-danger";
                    // Display specific error if available (e.g. from Java Bean Validation)
                    if (data.error) {
                        alertBox.innerText = data.error;
                    } else if (data.errors && data.errors.length > 0) {
                        alertBox.innerText = data.errors[0].defaultMessage;
                    } else {
                        alertBox.innerText = "Registration failed. Please try again.";
                    }
                }
            } catch (err) {
                alertBox.className = "alert alert-danger";
                alertBox.innerText = "Server connection error. Is the backend running?";
            } finally {
                btn.disabled = false;
                btn.innerText = "Sign up";
            }
        });
    </script>
</body>
</html>
