<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Internship Details - InternHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .navbar { background-color: #111827; }
    .fw-600 { font-weight: 600; }
    .skill-chip { display: inline-block; padding: 4px 12px; background: #e2e8f0; border-radius: 16px; font-size: 0.85rem; font-weight: 500; color: #475569; }
    .detail-card { background: white; border-radius: 12px; padding: 32px; border: 1px solid #e2e8f0; }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fw-600" href="/"><i class="bi bi-briefcase-fill me-2"></i>InternHub</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item"><a class="nav-link" href="/internships.html">Browse Internships</a></li>
        <li class="nav-item" id="navLogin"><a class="btn btn-primary ms-3 px-4" href="/login.html">Login</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-8">
      <button class="btn btn-light mb-4" onclick="history.back()"><i class="bi bi-arrow-left me-2"></i>Back</button>

      <div id="loading" class="text-center py-5">
        <div class="spinner-border text-primary" role="status"></div>
      </div>

      <div id="content" class="detail-card d-none">
        <div class="d-flex justify-content-between align-items-start mb-4">
          <div>
            <h2 class="fw-bold mb-1" id="title">Loading...</h2>
            <h5 class="text-primary mb-3" id="company"></h5>
            <div class="d-flex gap-3 text-muted small">
              <div><i class="bi bi-geo-alt me-1"></i><span id="location"></span></div>
              <div><i class="bi bi-currency-rupee me-1"></i><span id="stipend"></span></div>
              <div><i class="bi bi-calendar-event me-1"></i>Apply by <span id="deadline"></span></div>
            </div>
          </div>
          <div>
            <button class="btn btn-outline-secondary me-2" id="saveBtn" style="display:none;"><i class="bi bi-bookmark"></i></button>
            <button class="btn btn-primary px-4" id="applyBtn">Apply Now</button>
          </div>
        </div>

        <h5 class="fw-600 mt-5 mb-3">About the Internship</h5>
        <div class="text-secondary" id="description" style="white-space: pre-wrap;"></div>

        <h5 class="fw-600 mt-5 mb-3">Skills Required</h5>
        <div class="d-flex flex-wrap gap-2" id="skills"></div>

        <hr class="my-5">
        <div class="text-center text-muted small">
          Posted on <span id="created"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API = import.meta.env.VITE_API_URL || 'https://internhub-backend-2hyx.onrender.com';
const token = localStorage.getItem('authToken');
const urlParams = new URLSearchParams(window.location.search);
const internshipId = urlParams.get('id');

if(token) {
  document.getElementById('navLogin').innerHTML = `<a class="btn btn-outline-light ms-3 px-4" href="/student-dashboard.html">My Dashboard</a>`;
  document.getElementById('saveBtn').style.display = 'inline-block';
}

async function loadDetails() {
  if(!internshipId) {
    document.getElementById('loading').innerHTML = '<div class="alert alert-danger">No internship ID provided.</div>';
    return;
  }
  
  try {
    const res = await fetch(`${API}/api/public/internships/${internshipId}`);
    if(!res.ok) throw new Error('Not found');
    const data = await res.json();

    document.getElementById('title').textContent = data.title;
    document.getElementById('company').textContent = data.companyName;
    document.getElementById('location').textContent = data.location;
    document.getElementById('stipend').textContent = data.stipend;
    document.getElementById('deadline').textContent = new Date(data.deadline).toLocaleDateString();
    document.getElementById('description').textContent = data.description;
    document.getElementById('created').textContent = new Date(data.createdDate).toLocaleDateString();

    const skillsStr = data.requiredSkills || '';
    document.getElementById('skills').innerHTML = skillsStr.split(',').map(s => `<span class="skill-chip">${s.trim()}</span>`).join('');

    document.getElementById('loading').classList.add('d-none');
    document.getElementById('content').classList.remove('d-none');
  } catch(e) {
    document.getElementById('loading').innerHTML = '<div class="alert alert-danger">Internship not found or server error.</div>';
  }
}

document.getElementById('applyBtn').addEventListener('click', async function() {
  if(!token) { window.location = '/login.html'; return; }
  this.disabled = true;
  this.textContent = 'Applying...';
  try {
    const res = await fetch(`${API}/api/student/apply/${internshipId}`, { method: 'POST', headers: { Authorization: token }});
    const data = await res.json();
    if(res.ok) {
      this.textContent = 'Applied Successfully!';
      this.classList.replace('btn-primary', 'btn-success');
    } else {
      this.disabled = false;
      this.textContent = 'Apply Now';
      alert(data.error || 'Failed to apply');
    }
  } catch(e) {
    this.disabled = false;
    this.textContent = 'Apply Now';
    alert('Server error');
  }
});

document.getElementById('saveBtn').addEventListener('click', async function() {
  try {
    const res = await fetch(`${API}/api/student/save/${internshipId}`, { method: 'POST', headers: { Authorization: token }});
    if(res.ok) {
      this.innerHTML = '<i class="bi bi-bookmark-fill text-primary"></i> Saved';
    }
  } catch(e) {}
});

loadDetails();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
