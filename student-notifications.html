<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Notifications - InternHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <style>
    body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .sidebar { min-height: 100vh; background-color: #111827; color: white; padding-top: 1rem; }
    .sidebar a { color: #9ca3af; text-decoration: none; padding: 12px 20px; display: block; border-left: 3px solid transparent; }
    .sidebar a:hover, .sidebar a.active { background-color: #1f2937; color: white; border-left: 3px solid #3b82f6; }
    .sidebar i { margin-right: 10px; }
    .fw-600 { font-weight: 600; }
    .notif-card { transition: 0.2s; border-left: 4px solid transparent; }
    .notif-unread { border-left-color: #0d6efd; background-color: #f1f6ff; }
  </style>
</head>
<body>
<div class="d-flex">
  <!-- Sidebar -->
  <div class="sidebar" style="width: 250px;">
    <h4 class="text-white text-center mb-4"><i class="bi bi-briefcase-fill me-2"></i>InternHub</h4>
    <ul class="list-unstyled">
      <li class="nav-item"><a href="/student-dashboard.html"><i class="bi bi-grid-fill"></i>Dashboard</a></li>
      <li class="nav-item"><a href="/student-profile.html"><i class="bi bi-person-fill"></i>My Profile</a></li>
      <li class="nav-item"><a href="/internships.html"><i class="bi bi-search"></i>Find Internships</a></li>
      <li class="nav-item"><a href="/student-applications.html"><i class="bi bi-file-earmark-text-fill"></i>My Applications</a></li>
      <li class="nav-item"><a href="/student-portfolio.html"><i class="bi bi-folder-fill"></i>Portfolio</a></li>
      <li class="nav-item"><a href="/network.html"><i class="bi bi-people-fill"></i>Network</a></li>
      <li class="nav-item"><a href="/learning.html"><i class="bi bi-book-fill"></i>Learning</a></li>
      <li class="nav-item"><a href="/events.html"><i class="bi bi-calendar-event-fill"></i>Events</a></li>
      <li class="nav-item"><a href="/student-notifications.html" class="active"><i class="bi bi-bell-fill"></i>Notifications</a></li>
      <li class="nav-item mt-4"><a href="#" id="logoutBtn"><i class="bi bi-box-arrow-right"></i>Logout</a></li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="flex-grow-1">
    <div class="bg-white shadow-sm p-3 mb-4 d-flex justify-content-between align-items-center">
      <h5 class="m-0 fw-600">Notifications</h5>
      <button class="btn btn-sm btn-outline-primary" id="markAllBtn">Mark all as read</button>
    </div>

    <div class="container pb-5">
      <div id="notifList" class="d-flex flex-column gap-3">
        <div class="text-center py-5 text-muted">
          <div class="spinner-border text-primary"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API = import.meta.env.VITE_API_URL || 'https://internhub-backend-2hyx.onrender.com';
const token = localStorage.getItem('authToken');
if(!token) window.location = '/login.html';

document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('authToken');
  window.location = '/login.html';
});

async function loadNotifications() {
  try {
    const res = await fetch(`${API}/api/notifications`, {
      headers: { Authorization: token }
    });
    if(!res.ok) throw new Error();
    const data = await res.json();
    const list = document.getElementById('notifList');
    
    if(data.length === 0) {
      list.innerHTML = `<div class="text-center py-5 text-muted"><i class="bi bi-bell-slash fs-1 d-block mb-3"></i>You have no notifications.</div>`;
      return;
    }

    list.innerHTML = data.map(n => `
      <div class="card notif-card ${!n.read ? 'notif-unread' : ''}">
        <div class="card-body d-flex justify-content-between align-items-center">
          <div>
            <div class="small text-muted mb-1">${new Date(n.createdDate).toLocaleString()}</div>
            <div class="fw-600">${n.message}</div>
          </div>
          <div>
            ${!n.read ? `<button class="btn btn-sm btn-primary me-2" onclick="markRead(${n.id})">Mark Read</button>` : ''}
            <button class="btn btn-sm btn-danger" onclick="deleteNotif(${n.id})"><i class="bi bi-trash"></i></button>
          </div>
        </div>
      </div>
    `).join('');
  } catch(e) {
    document.getElementById('notifList').innerHTML = '<div class="alert alert-danger">Failed to load notifications.</div>';
  }
}

window.markRead = async (id) => {
  await fetch(`${API}/api/notifications/${id}/read`, { method:'PUT', headers: { Authorization: token }});
  loadNotifications();
};

window.deleteNotif = async (id) => {
  await fetch(`${API}/api/notifications/${id}`, { method:'DELETE', headers: { Authorization: token }});
  loadNotifications();
};

document.getElementById('markAllBtn').addEventListener('click', async () => {
  await fetch(`${API}/api/notifications/read-all`, { method:'PUT', headers: { Authorization: token }});
  loadNotifications();
});

loadNotifications();
</script>
</body>
</html>
