<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - InternHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#2563eb;--navy:#0f172a;--sidebar-w:250px;}
*{font-family:'Inter',sans-serif;}body{background:#f1f5f9;}
.sidebar{width:var(--sidebar-w);height:100vh;position:fixed;top:0;left:0;background:var(--navy);overflow-y:auto;z-index:100;}
.sidebar-logo{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,.1);font-weight:800;font-size:1.2rem;color:white;}.sidebar-logo span{color:#60a5fa;}
.nav-item a{display:flex;align-items:center;gap:12px;padding:11px 20px;color:rgba(255,255,255,.65);text-decoration:none;font-size:.9rem;font-weight:500;border-radius:8px;margin:2px 8px;transition:.15s;}
.nav-item a:hover,.nav-item a.active{background:rgba(96,165,250,.15);color:#60a5fa;}
.main-content{margin-left:var(--sidebar-w);min-height:100vh;}
.topbar{background:white;border-bottom:1px solid #e2e8f0;padding:14px 28px;position:sticky;top:0;z-index:50;}
.stat-card{background:white;border-radius:12px;padding:20px;border:1px solid #e2e8f0;}
.stat-card .stat-icon{width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;}
.stat-card .stat-value{font-size:1.8rem;font-weight:800;color:var(--navy);}
.section-card{background:white;border-radius:12px;padding:24px;border:1px solid #e2e8f0;margin-bottom:24px;}
.table th{font-weight:600;color:#64748b;font-size:.8rem;text-transform:uppercase;}
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-logo"><i class="bi bi-briefcase-fill me-2"></i>Intern<span>Hub</span></div>
  <ul class="nav flex-column mt-3" style="list-style:none;padding:0;">
    <li class="nav-item"><a href="/admin-dashboard.html" class="active"><i class="bi bi-speedometer2"></i>Dashboard</a></li>
    <li class="nav-item mt-3"><a href="#" onclick="localStorage.clear();window.location='/index.html'"><i class="bi bi-box-arrow-right"></i>Logout</a></li>
  </ul>
</div>
<div class="main-content">
  <div class="topbar d-flex align-items-center justify-content-between">
    <h6 class="mb-0 fw-700">Platform Admin</h6>
    <div class="fw-600 small text-muted">Admin System</div>
  </div>
  <div class="p-4">
    <div class="row g-3 mb-4">
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="stat-icon mb-2" style="background:#dbeafe;color:#2563eb;"><i class="bi bi-people-fill"></i></div>
          <div class="stat-value" id="sUsers">â€”</div>
          <div class="text-muted small">Total Users</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="stat-icon mb-2" style="background:#fef3c7;color:#d97706;"><i class="bi bi-building"></i></div>
          <div class="stat-value" id="sComps">â€”</div>
          <div class="text-muted small">Companies (V/P)</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="stat-icon mb-2" style="background:#ede9fe;color:#7c3aed;"><i class="bi bi-briefcase-fill"></i></div>
          <div class="stat-value" id="sOpps">â€”</div>
          <div class="text-muted small">Active Opportunities</div>
        </div>
      </div>
      <div class="col-6 col-md-3">
        <div class="stat-card">
          <div class="stat-icon mb-2" style="background:#dcfce7;color:#16a34a;"><i class="bi bi-file-earmark-check-fill"></i></div>
          <div class="stat-value" id="sApps">â€”</div>
          <div class="text-muted small">Total Applications</div>
        </div>
      </div>
    </div>

    <div class="section-card">
      <h6 class="fw-700 mb-3">Company Verifications</h6>
      <div class="table-responsive">
        <table class="table align-middle">
          <thead><tr><th>Company</th><th>Email</th><th>Website</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="companyTable"><tr><td colspan="5" class="text-center">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script>
const API='https://internhub-backend-2hyx.onrender.com';
const token=localStorage.getItem('authToken');
if(!token)window.location='/login.html';

async function loadData(){
  try{
    const sRes=await fetch(`${API}/api/admin/dashboard`,{headers:{Authorization:token}});
    if(sRes.status===401){localStorage.clear();window.location='/login.html';return;}
    const stats=await sRes.json();
    document.getElementById('sUsers').textContent=stats.totalUsers;
    document.getElementById('sComps').textContent=`${stats.verifiedCompanies} / ${stats.pendingCompanies}`;
    document.getElementById('sOpps').textContent=stats.publishedInternships;
    document.getElementById('sApps').textContent=stats.totalApplications;

    const cRes=await fetch(`${API}/api/admin/companies`,{headers:{Authorization:token}});
    const comps=await cRes.json();
    const tbody=document.getElementById('companyTable');
    if(!comps.length)tbody.innerHTML='<tr><td colspan="5" class="text-center text-muted">No companies</td></tr>';
    else{
      tbody.innerHTML=comps.map(c=>`
        <tr>
          <td class="fw-600">${c.companyName}</td>
          <td>${c.email}</td>
          <td><a href="${c.website}" target="_blank">${c.website||'-'}</a></td>
          <td><span class="badge bg-${c.verificationStatus==='VERIFIED'?'success':c.verificationStatus==='PENDING'?'warning text-dark':'danger'}">${c.verificationStatus}</span></td>
          <td>
            ${c.verificationStatus!=='VERIFIED'?`<button class="btn btn-sm btn-success me-1" onclick="verify(${c.id})">Verify</button>`:''}
            ${c.verificationStatus!=='REJECTED'?`<button class="btn btn-sm btn-outline-danger" onclick="reject(${c.id})">Reject</button>`:''}
          </td>
        </tr>
      `).join('');
    }
  }catch(e){console.error(e);}
}
async function verify(id){await fetch(`${API}/api/admin/companies/${id}/verify`,{method:'POST',headers:{Authorization:token}});loadData();}
async function reject(id){await fetch(`${API}/api/admin/companies/${id}/reject`,{method:'POST',headers:{Authorization:token}});loadData();}
loadData();
</script>
</body>
</html>
