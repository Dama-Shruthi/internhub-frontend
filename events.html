<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Events - InternHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#2563eb;--navy:#0f172a;--sidebar-w:250px;}
*{font-family:'Inter',sans-serif;}body{background:#f1f5f9;}
.sidebar{width:var(--sidebar-w);height:100vh;position:fixed;top:0;left:0;background:var(--navy);overflow-y:auto;z-index:100;}
.sidebar-logo{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,.1);font-weight:800;font-size:1.2rem;color:white;}.sidebar-logo span{color:#60a5fa;}
.nav-item a{display:flex;align-items:center;gap:12px;padding:11px 20px;color:rgba(255,255,255,.65);text-decoration:none;font-size:.9rem;font-weight:500;border-radius:8px;margin:2px 8px;transition:.15s;}
.nav-item a:hover,.nav-item a.active{background:rgba(96,165,250,.15);color:#60a5fa;}
.main-content{margin-left:var(--sidebar-w);min-height:100vh;}
.topbar{background:white;border-bottom:1px solid #e2e8f0;padding:14px 28px;position:sticky;top:0;z-index:50;}
.event-card{background:white;border-radius:12px;padding:0;border:1px solid #e2e8f0;overflow:hidden;}
.event-img{height:120px;background:linear-gradient(135deg,var(--primary),#7c3aed);}
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-logo"><i class="bi bi-briefcase-fill me-2"></i>Intern<span>Hub</span></div>
  <ul class="nav flex-column mt-3" style="list-style:none;padding:0;">
    <li class="nav-item"><a href="/student-dashboard.html"><i class="bi bi-grid-fill"></i>Dashboard</a></li>
    <li class="nav-item"><a href="/network.html"><i class="bi bi-people-fill"></i>Network</a></li>
    <li class="nav-item"><a href="/events.html" class="active"><i class="bi bi-calendar-event"></i>Events</a></li>
    <li class="nav-item mt-3"><a href="#" onclick="localStorage.clear();window.location='/index.html'"><i class="bi bi-box-arrow-right"></i>Logout</a></li>
  </ul>
</div>
<div class="main-content">
  <div class="topbar d-flex align-items-center justify-content-between">
    <h6 class="mb-0 fw-700">Career Events & Hackathons</h6>
  </div>
  <div class="p-4">
    <div class="row g-4" id="eventList">
      <div class="col-12 text-center py-5"><div class="spinner-border text-primary"></div></div>
    </div>
  </div>
</div>

<script>
const API='http://localhost:8080';
const token=localStorage.getItem('authToken');
if(!token)window.location='/login.html';

async function loadEvents(){
  try{
    const res=await fetch(`${API}/api/community/events`,{headers:{Authorization:token}});
    const data=await res.json();
    const el=document.getElementById('eventList');
    if(!data.length){el.innerHTML='<div class="col-12 text-center py-5 text-muted"><i class="bi bi-calendar-x fs-1 d-block mb-3"></i><h5>No upcoming events</h5></div>';return;}
    el.innerHTML=data.map(e=>`
      <div class="col-md-4">
        <div class="event-card">
          <div class="event-img d-flex align-items-center justify-content-center text-white"><i class="bi bi-calendar-star fs-1"></i></div>
          <div class="p-3">
            <div class="badge bg-primary bg-opacity-10 text-primary mb-2">${e.type||'Event'}</div>
            <h6 class="fw-700">${e.title}</h6>
            <div class="text-muted small mb-3 text-truncate">${e.description}</div>
            <div class="d-flex justify-content-between align-items-center small mb-3 text-muted fw-600">
              <span><i class="bi bi-geo-alt me-1"></i>${e.location||'Online'}</span>
              <span><i class="bi bi-clock me-1"></i>${new Date(e.date).toLocaleDateString()}</span>
            </div>
            <button class="btn btn-outline-primary btn-sm w-100" onclick="alert('Registered!')">Register Now</button>
          </div>
        </div>
      </div>
    `).join('');
  }catch(e){}
}
loadEvents();
</script>
</body>
</html>
