<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio - InternHub</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--primary:#2563eb;--navy:#0f172a;--sidebar-w:250px;}
*{font-family:'Inter',sans-serif;}body{background:#f1f5f9;}
.sidebar{width:var(--sidebar-w);height:100vh;position:fixed;top:0;left:0;background:var(--navy);overflow-y:auto;z-index:100;}
.sidebar-logo{padding:24px 20px;border-bottom:1px solid rgba(255,255,255,.1);font-weight:800;font-size:1.2rem;color:white;}.sidebar-logo span{color:#60a5fa;}
.nav-item a{display:flex;align-items:center;gap:12px;padding:11px 20px;color:rgba(255,255,255,.65);text-decoration:none;font-size:.9rem;font-weight:500;border-radius:8px;margin:2px 8px;transition:.15s;}
.nav-item a:hover,.nav-item a.active{background:rgba(96,165,250,.15);color:#60a5fa;}
.main-content{margin-left:var(--sidebar-w);min-height:100vh;}
.topbar{background:white;border-bottom:1px solid #e2e8f0;padding:14px 28px;position:sticky;top:0;z-index:50;}
.section-card{background:white;border-radius:12px;padding:24px;border:1px solid #e2e8f0;margin-bottom:20px;}
.project-card{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:16px;margin-bottom:12px;transition:.2s;}
.project-card:hover{border-color:var(--primary);background:white;box-shadow:0 4px 12px rgba(0,0,0,.05);}
.tech-chip{background:white;border:1px solid #cbd5e1;padding:2px 8px;border-radius:4px;font-size:.75rem;color:#475569;}
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-logo"><i class="bi bi-briefcase-fill me-2"></i>Intern<span>Hub</span></div>
  <ul class="nav flex-column mt-3" style="list-style:none;padding:0;">
    <li class="nav-item"><a href="/student-dashboard.html"><i class="bi bi-grid-fill"></i>Dashboard</a></li>
    <li class="nav-item"><a href="/student-profile.html"><i class="bi bi-person-fill"></i>My Profile</a></li>
    <li class="nav-item"><a href="/student-portfolio.html" class="active"><i class="bi bi-folder-fill"></i>Portfolio & Projects</a></li>
    <li class="nav-item"><a href="/network.html"><i class="bi bi-people-fill"></i>Network</a></li>
    <li class="nav-item"><a href="/learning.html"><i class="bi bi-journal-code"></i>Learning Hub</a></li>
    <li class="nav-item mt-3"><a href="#" onclick="localStorage.clear();window.location='/index.html'"><i class="bi bi-box-arrow-right"></i>Logout</a></li>
  </ul>
</div>
<div class="main-content">
  <div class="topbar d-flex align-items-center justify-content-between">
    <h6 class="mb-0 fw-700">Portfolio & Projects</h6>
    <button class="btn btn-primary btn-sm" onclick="newProject()"><i class="bi bi-plus"></i> Add Project</button>
  </div>
  <div class="p-4">
    <div class="row g-4">
      <div class="col-lg-8" id="projectList">
        <div class="text-center py-5"><div class="spinner-border text-primary"></div></div>
      </div>
      <div class="col-lg-4">
        <div class="section-card">
          <h6 class="fw-700 mb-3">Resume Builder</h6>
          <p class="small text-muted mb-3">Generate a professional resume using your profile data and projects.</p>
          <button class="btn btn-outline-primary w-100 mb-2" onclick="alert('Generating PDF...')"><i class="bi bi-file-earmark-pdf me-2"></i>Download Resume PDF</button>
          <button class="btn btn-outline-secondary w-100" onclick="alert('Opening preview...')"><i class="bi bi-eye me-2"></i>Preview</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Project Modal -->
<div class="modal fade" id="projectModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header"><h5 class="modal-title fw-700">Add Project</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body">
        <form id="projectForm">
          <div class="mb-3"><label class="form-label small fw-600">Project Title</label><input type="text" id="pTitle" class="form-control" required></div>
          <div class="mb-3"><label class="form-label small fw-600">Description</label><textarea id="pDesc" class="form-control" rows="3" required></textarea></div>
          <div class="mb-3"><label class="form-label small fw-600">Technologies (comma-separated)</label><input type="text" id="pTech" class="form-control" placeholder="React, Node.js, MongoDB"></div>
          <div class="row g-3 mb-3">
            <div class="col-md-6"><label class="form-label small fw-600">GitHub URL</label><input type="url" id="pGit" class="form-control" placeholder="https://github.com/..."></div>
            <div class="col-md-6"><label class="form-label small fw-600">Live Demo URL</label><input type="url" id="pDemo" class="form-control" placeholder="https://..."></div>
          </div>
          <div class="mb-3"><label class="form-label small fw-600">Your Role</label><input type="text" id="pRole" class="form-control" placeholder="Full Stack Developer"></div>
        </form>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button type="button" class="btn btn-primary" onclick="saveProject()">Save Project</button></div>
    </div>
  </div>
</div>

<script>
const API='https://internhub-backend-2hyx.onrender.com';
const token=localStorage.getItem('authToken');
if(!token)window.location='/login.html';

async function loadProjects(){
  try{
    const res=await fetch(`${API}/api/student/projects`,{headers:{Authorization:token}});
    const data=await res.json();
    const el=document.getElementById('projectList');
    if(!data.length){el.innerHTML='<div class="section-card text-center py-5 text-muted"><i class="bi bi-folder-x fs-1 d-block mb-3"></i><h5>No projects added</h5><p>Showcase your work to increase your chances of getting hired.</p><button class="btn btn-primary mt-2" onclick="newProject()">Add Project</button></div>';return;}
    el.innerHTML=data.map(p=>`
      <div class="section-card">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <h5 class="fw-700 text-navy mb-0">${p.title}</h5>
          <button class="btn btn-sm btn-outline-danger border-0" onclick="deleteProject(${p.id})"><i class="bi bi-trash"></i></button>
        </div>
        ${p.role?`<div class="small fw-600 text-primary mb-2">${p.role}</div>`:''}
        <p class="text-muted small mb-3">${p.description}</p>
        <div class="d-flex gap-2 mb-3">
          ${(p.technologies||'').split(',').map(t=>t.trim()&&`<span class="tech-chip">${t.trim()}</span>`).join('')}
        </div>
        <div class="d-flex gap-3 border-top pt-3">
          ${p.githubUrl?`<a href="${p.githubUrl}" target="_blank" class="text-decoration-none small text-dark"><i class="bi bi-github me-1"></i>Repository</a>`:''}
          ${p.demoUrl?`<a href="${p.demoUrl}" target="_blank" class="text-decoration-none small text-primary"><i class="bi bi-box-arrow-up-right me-1"></i>Live Demo</a>`:''}
        </div>
      </div>
    `).join('');
  }catch(e){console.error(e);}
}

function newProject(){
  document.getElementById('projectForm').reset();
  new bootstrap.Modal(document.getElementById('projectModal')).show();
}

async function saveProject(){
  const data={
    title:document.getElementById('pTitle').value,
    description:document.getElementById('pDesc').value,
    technologies:document.getElementById('pTech').value,
    githubUrl:document.getElementById('pGit').value,
    demoUrl:document.getElementById('pDemo').value,
    role:document.getElementById('pRole').value
  };
  if(!data.title||!data.description)return alert('Title and description required');
  try{
    const res=await fetch(`${API}/api/student/projects`,{method:'POST',headers:{Authorization:token,'Content-Type':'application/json'},body:JSON.stringify(data)});
    if(res.ok){bootstrap.Modal.getInstance(document.getElementById('projectModal')).hide();loadProjects();}
    else alert('Failed to save');
  }catch(e){}
}

async function deleteProject(id){
  if(!confirm('Delete this project?'))return;
  await fetch(`${API}/api/student/projects/${id}`,{method:'DELETE',headers:{Authorization:token}});
  loadProjects();
}

loadProjects();
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
