<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - InternHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        :root { --primary-color: #008bdc; }
        body { background-color: #f8f9fa; font-family: 'Segoe UI', sans-serif; }
        .auth-card {
            max-width: 450px;
            margin: 60px auto;
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }
        .btn-primary { background-color: var(--primary-color); border: none; }
        .btn-primary:hover { background-color: #0073b7; }
    </style>
</head>
<body>
    <div class="container">
        <div class="text-center mt-5">
            <a href="index.html" class="text-decoration-none text-dark fs-3 fw-bold">
                <i class="bi bi-briefcase-fill me-2" style="color: var(--primary-color);"></i>InternHub
            </a>
        </div>
        
        <div class="auth-card">
            <h3 class="text-center mb-4 fw-bold">Login</h3>
            
            <div id="alertBox" class="alert d-none"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label text-muted fw-semibold">Email address</label>
                    <input type="email" class="form-control" id="email" required placeholder="john@example.com">
                </div>
                <div class="mb-4">
                    <label class="form-label text-muted fw-semibold">Password</label>
                    <input type="password" class="form-control" id="password" required placeholder="Enter password">
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2 fw-bold" id="submitBtn">Login</button>
            </form>
            
            <div class="text-center mt-4">
                New to InternHub? <a href="register.html" class="text-decoration-none fw-bold" style="color: var(--primary-color);">Register</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('alertBox');
            
            btn.disabled = true;
            btn.innerText = "Logging in...";
            alertBox.classList.add('d-none');
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            // Encode for Basic Auth
            const basicAuthToken = btoa(email + ":" + password);

            try {
                // Test the credentials against the secured /me endpoint
                const response = await fetch('https://internhub-backend-2hyx.onrender.com/api/auth/me', {
                    method: 'GET',
                    headers: { 'Authorization': 'Basic ' + basicAuthToken }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    
                    // Save to localStorage for future API requests
                    localStorage.setItem('authToken', 'Basic ' + basicAuthToken);
                    localStorage.setItem('userRole', data.authorities);
                    localStorage.setItem('userEmail', data.email);
                    
                    alertBox.className = "alert alert-success";
                    alertBox.innerText = "Login successful! Redirecting...";
                    
                    // Redirect based on role
                    setTimeout(() => {
                        if (data.authorities.includes("ROLE_STUDENT")) window.location.href = 'index.html';
                        else if (data.authorities.includes("ROLE_COMPANY")) window.location.href = 'index.html';
                        else window.location.href = 'index.html';
                    }, 1000);
                } else {
                    alertBox.className = "alert alert-danger";
                    alertBox.innerText = "Invalid email or password.";
                }
            } catch (err) {
                alertBox.className = "alert alert-danger";
                alertBox.innerText = "Server connection error. Is the backend running?";
            } finally {
                btn.disabled = false;
                btn.innerText = "Login";
            }
        });
    </script>
</body>
</html>
